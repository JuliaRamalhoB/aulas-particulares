<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Reservas</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #f0f0f0; }
    .painel-header {
      background: #1a1a2e;
      color: white;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .painel-header h1 { font-size: 22px; }
    #conteudo { max-width: 900px; margin: 30px auto; padding: 0 16px; }

    /* AGENDA SEMANAL */
    .semana-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      background: white;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .semana-nav button {
      background: #1a1a2e;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .semana-nav button:hover { background: #2e2e5e; }
    .semana-nav span { font-weight: 600; font-size: 16px; color: #1a1a2e; }

    .agenda-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 30px;
    }

    .agenda-dia {
      background: white;
      border-radius: 10px;
      padding: 12px 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      min-height: 120px;
    }

    .agenda-dia-header {
      text-align: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    .agenda-dia-header .nome-dia {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      font-weight: 600;
    }

    .agenda-dia-header .numero-dia {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .agenda-dia-header.hoje .numero-dia {
      background: #1a1a2e;
      color: white;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      font-size: 15px;
    }

    .aula-chip {
      background: #e8f5e9;
      border-left: 3px solid #4caf50;
      border-radius: 4px;
      padding: 4px 6px;
      margin-bottom: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .aula-chip:hover { background: #c8e6c9; }
    .aula-chip .hora { font-weight: 700; color: #1a1a2e; }
    .aula-chip .mat { color: #555; }

    .aula-chip.pendente {
      background: #fff8e1;
      border-left-color: #f0a500;
    }

    .sem-aulas {
      text-align: center;
      color: #ccc;
      font-size: 12px;
      padding-top: 8px;
    }

    /* PENDENTES */
    .secao-pendentes {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }

    .secao-pendentes h2 {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-count {
      background: #f0a500;
      color: white;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .reserva-card {
      border: 1.5px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .reserva-card.pendente { border-left: 5px solid #f0a500; }
    .reserva-card h3 { margin-bottom: 6px; color: #1a1a2e; }
    .reserva-card p { font-size: 14px; color: #555; margin-bottom: 3px; }

    .acoes { margin-top: 12px; display: flex; gap: 8px; }

    .btn-confirmar {
      background: #1a1a2e;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-confirmar:hover { background: #2e2e5e; }

    .btn-rejeitar {
      background: white;
      color: #c62828;
      border: 1.5px solid #c62828;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-rejeitar:hover { background: #ffebee; }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.aberto { display: flex; }
    .modal {
      background: white;
      border-radius: 12px;
      padding: 28px;
      max-width: 400px;
      width: 90%;
    }
    .modal h3 { margin-bottom: 12px; color: #1a1a2e; }
    .modal p { font-size: 14px; color: #555; margin-bottom: 6px; }
    .modal-fechar {
      margin-top: 16px;
      background: #1a1a2e;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="painel-header">
    <h1>📋 Painel de Reservas</h1>
    <span id="contadorPendentes"></span>
  </div>

  <div id="conteudo">

    <!-- PEDIDOS PENDENTES -->
    <div class="secao-pendentes" id="secaoPendentes">
      <h2>⏳ Pedidos pendentes <span class="badge-count" id="numPendentes">0</span></h2>
      <div id="listaPendentes"><p style="color:#888">A carregar...</p></div>
    </div>

    <!-- AGENDA SEMANAL -->
    <div class="semana-nav">
      <button id="btnSemanaAnterior">&#8592; Semana anterior</button>
      <span id="labelSemana"></span>
      <button id="btnProximaSemana">Próxima semana &#8594;</button>
    </div>

    <div class="agenda-grid" id="agendaGrid"></div>

  </div>

  <!-- MODAL DE DETALHE -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitulo"></h3>
      <div id="modalConteudo"></div>
      <button class="modal-fechar" onclick="fecharModal()">Fechar</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://thnpicjrzqiivnifmhjp.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRobnBpY2pyenFpaXZuaWZtaGpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NDU5MzYsImV4cCI6MjA5MzIyMTkzNn0.-vIc6-R6oBZMyJT6SE5hLP5-nZQPNlaft8w6tyomZfE";

    const nomesDiasCurtos = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
    const nomesMeses = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

    let inicioSemana = new Date();
    inicioSemana.setHours(0,0,0,0);
    // Vai para o domingo da semana atual
    inicioSemana.setDate(inicioSemana.getDate() - inicioSemana.getDay());

    let todasReservas = [];

    async function carregarTudo() {
      const resposta = await fetch(
        `${SUPABASE_URL}/rest/v1/reservas?order=data_aula.asc,horario.asc`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        }
      );
      todasReservas = await resposta.json();
      renderizarPendentes();
      renderizarAgenda();
    }

    function renderizarPendentes() {
      const pendentes = todasReservas.filter(r => r.estado === "pendente");
      document.getElementById("numPendentes").textContent = pendentes.length;

      const lista = document.getElementById("listaPendentes");

      if (pendentes.length === 0) {
        lista.innerHTML = "<p style='color:#888'>Nenhum pedido pendente.</p>";
        return;
      }

      lista.innerHTML = pendentes.map(r => `
        <div class="reserva-card pendente" id="card-${r.id}">
          <h3>${r.nome}</h3>
          <p>📚 ${r.materia} · ⏱ ${r.duracao}</p>
          <p>📅 ${formatarData(r.data_aula)} às ${r.horario}</p>
          <p>📧 ${r.email}${r.telefone ? " · 📞 " + r.telefone : ""}</p>
          ${r.observacoes ? `<p style="font-style:italic;color:#777">💬 "${r.observacoes}"</p>` : ""}
          <div class="acoes">
            <button class="btn-confirmar" onclick="mudarEstado('${r.id}', 'confirmada')">✅ Confirmar</button>
            <button class="btn-rejeitar" onclick="mudarEstado('${r.id}', 'rejeitada')">❌ Rejeitar</button>
          </div>
        </div>
      `).join("");
    }

    function renderizarAgenda() {
      const fim = new Date(inicioSemana);
      fim.setDate(fim.getDate() + 6);

      document.getElementById("labelSemana").textContent =
        `${inicioSemana.getDate()} ${nomesMeses[inicioSemana.getMonth()]} – ${fim.getDate()} ${nomesMeses[fim.getMonth()]} ${fim.getFullYear()}`;

      const grid = document.getElementById("agendaGrid");
      grid.innerHTML = "";

      const hoje = new Date();
      hoje.setHours(0,0,0,0);

      for (let i = 0; i < 7; i++) {
        const dia = new Date(inicioSemana);
        dia.setDate(dia.getDate() + i);

        // Gera dataStr diretamente dos valores do objeto — sem toISOString()
        const ano = dia.getFullYear();
        const mes = String(dia.getMonth() + 1).padStart(2, '0');
        const d = String(dia.getDate()).padStart(2, '0');
        const dataStr = `${ano}-${mes}-${d}`;

        const ehHoje = dia.getTime() === hoje.getTime();

        const col = document.createElement("div");
        col.className = "agenda-dia";

        const header = document.createElement("div");
        header.className = "agenda-dia-header" + (ehHoje ? " hoje" : "");
        header.innerHTML = `
          <div class="nome-dia">${nomesDiasCurtos[dia.getDay()]}</div>
          <div class="numero-dia">${dia.getDate()}</div>
        `;
        col.appendChild(header);

        const aulasNoDia = todasReservas.filter(r =>
          r.data_aula === dataStr && (r.estado === "confirmada" || r.estado === "pendente")
        );

        if (aulasNoDia.length === 0) {
          const vazio = document.createElement("div");
          vazio.className = "sem-aulas";
          vazio.textContent = "Livre";
          col.appendChild(vazio);
        } else {
          aulasNoDia.forEach(r => {
            const chip = document.createElement("div");
            chip.className = "aula-chip" + (r.estado === "pendente" ? " pendente" : "");
            chip.innerHTML = `<div class="hora">${r.horario}</div><div class="mat">${r.materia}</div>`;
            chip.addEventListener("click", () => abrirModal(r));
            col.appendChild(chip);
          });
        }

        grid.appendChild(col);
      }
    }

    function abrirModal(r) {
      document.getElementById("modalTitulo").textContent = `${r.nome} — ${r.horario}`;
      document.getElementById("modalConteudo").innerHTML = `
        <p>📚 ${r.materia} · ⏱ ${r.duracao}</p>
        <p>📅 ${formatarData(r.data_aula)}</p>
        <p>📧 ${r.email}</p>
        ${r.telefone ? `<p>📞 ${r.telefone}</p>` : ""}
        ${r.observacoes ? `<p>💬 ${r.observacoes}</p>` : ""}
        <p style="margin-top:8px">Estado: <strong>${r.estado}</strong></p>
      `;
      document.getElementById("modalOverlay").classList.add("aberto");
    }

    function fecharModal() {
      document.getElementById("modalOverlay").classList.remove("aberto");
    }

    async function mudarEstado(id, novoEstado) {
      await fetch(`${SUPABASE_URL}/rest/v1/reservas?id=eq.${id}`, {
        method: "PATCH",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ estado: novoEstado })
      });
      await carregarTudo();
    }

    function formatarData(dataStr) {
      if (!dataStr) return "";
      const [ano, mes, dia] = dataStr.split("-");
      const d = new Date(Number(ano), Number(mes)-1, Number(dia));
      const nomesDiasCompletos = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
      return `${nomesDiasCompletos[d.getDay()]}, ${dia}/${mes}/${ano}`;
    }

    document.getElementById("btnSemanaAnterior").addEventListener("click", () => {
      inicioSemana.setDate(inicioSemana.getDate() - 7);
      renderizarAgenda();
    });

    document.getElementById("btnProximaSemana").addEventListener("click", () => {
      inicioSemana.setDate(inicioSemana.getDate() + 7);
      renderizarAgenda();
    });

    document.getElementById("modalOverlay").addEventListener("click", (e) => {
      if (e.target === document.getElementById("modalOverlay")) fecharModal();
    });

    carregarTudo();
  </script>
</body>
</html>
